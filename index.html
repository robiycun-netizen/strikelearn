<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StrikeLearn — Year 7 Learning</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#182033;--muted:#687086;--primary:#5b5ce2;--primary2:#7c5cff;--line:#e7e9f0;--good:#16a36a;--warn:#f59e0b;--danger:#e45858}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{min-height:100vh;animation:pageIn .38s ease both}.auth{animation:authIn .45s ease both}.authbox{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}.card,.hero{animation:cardIn .42s ease both}.grid3 .card:nth-child(2){animation-delay:.05s}.grid3 .card:nth-child(3){animation-delay:.1s}.lesson{animation:slideUp .35s ease both}.lesson:nth-child(2){animation-delay:.04s}.lesson:nth-child(3){animation-delay:.08s}.lesson:nth-child(4){animation-delay:.12s}.option{animation:optionIn .28s ease both;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}.option:nth-child(2){animation-delay:.04s}.option:nth-child(3){animation-delay:.08s}.option:nth-child(4){animation-delay:.12s}.option:hover{transform:translateY(-2px);box-shadow:0 5px 16px #1d223315}.option:active{transform:scale(.98)}.option.correct{animation:correctPop .38s ease both}.option.wrong{animation:wrongShake .38s ease both}.result{animation:resultIn .35s ease both}.btn{transition:transform .16s ease,box-shadow .16s ease}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 18px #5b5ce233}.btn:active:not(:disabled){transform:scale(.97)}.pill{animation:badgeIn .45s ease both}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes authIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes optionIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes correctPop{0%{transform:scale(1)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes resultIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes badgeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;color:var(--primary)}.topstats{display:flex;gap:10px;align-items:center}.pill{background:#f0f1ff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px}.pill.coin{background:#fff6d8}.pill.streak{background:#fff0e8}
.layout{display:grid;grid-template-columns:220px 1fr;max-width:1320px;margin:auto}.sidebar{padding:24px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 68px)}.nav{width:100%;text-align:left;background:transparent;padding:13px 14px;border-radius:12px;color:var(--muted);font-weight:700;margin-bottom:5px}.nav.active,.nav:hover{background:#eeefff;color:var(--primary)}
main{padding:28px;max-width:1000px;width:100%;margin:auto}.hero{background:linear-gradient(135deg,#5b5ce2,#8165f4);color:#fff;border-radius:24px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;opacity:.9}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 3px 14px rgba(20,25,50,.035)}.card h3,.card h2{margin-top:0}.muted{color:var(--muted)}.big{font-size:30px;font-weight:900}.progress{height:10px;background:#eceef5;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:999px}.subject{display:flex;gap:15px;align-items:center}.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#f0f1ff}.btn{background:var(--primary);color:#fff;padding:11px 16px;border-radius:12px;font-weight:800}.btn.secondary{background:#eef0f7;color:var(--text)}.btn.good{background:var(--good)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack>*+*{margin-top:12px}.lesson{display:flex;justify-content:space-between;align-items:center;padding:15px;border:1px solid var(--line);border-radius:14px;margin-top:10px}.tag{font-size:12px;font-weight:800;background:#f0f1f7;border-radius:999px;padding:5px 8px;color:var(--muted)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f0f1ff,#fafaff)}.authbox{width:min(480px,100%);background:#fff;padding:32px;border-radius:24px;border:1px solid var(--line);box-shadow:0 15px 50px rgba(20,25,50,.08)}.authbox h1{margin:0}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dfe2eb;border-radius:12px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--primary)}.switch{color:var(--primary);font-weight:800;cursor:pointer}.error{color:var(--danger);font-size:13px;font-weight:700;margin-top:8px}
.lessonpage{max-width:850px}.concept-dots{display:flex;justify-content:center;gap:9px;margin:18px 0}.concept-dot{width:11px;height:11px;border-radius:50%;background:#dfe2eb;transition:transform .2s,background .2s}.concept-dot.active{background:var(--primary);transform:scale(1.25)}.concept-dot.done{background:#9b9de9}.concept-visual{display:grid;place-items:center;min-height:130px;margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fafaff;font-size:16px;overflow:hidden}.number-line{display:flex;align-items:center;gap:12px;width:min(100%,650px)}.nl-track{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;flex:1}.nl-track span{padding:10px 3px;text-align:center;border-radius:9px;background:#eef1ff;font-weight:700}.nl-track .zero{background:#dfe4ff}.nl-arrow{font-size:24px;font-weight:800}.fraction-visual{display:flex;align-items:center;gap:22px;font-size:22px}.fraction-grid{display:grid;grid-template-columns:repeat(2,32px);grid-template-rows:repeat(2,32px);gap:3px}.fraction-grid i{background:#6366e8;border-radius:4px}.fraction-grid i.empty{background:#e7e9f2}.cell-diagram{display:flex;align-items:center;gap:20px}.cell-circle{width:150px;height:110px;border:7px solid #9aa4e8;border-radius:45% 55% 50% 48%;position:relative;background:#eef8ff}.cell-nucleus{position:absolute;left:52px;top:35px;background:#b9a8ef;border-radius:50%;padding:10px 7px;font-size:11px}.cell-chloro{position:absolute;right:7px;top:14px;background:#b7e5c0;border-radius:50%;padding:5px;font-size:9px}.cell-label{position:absolute;left:9px;bottom:8px;font-size:10px}.visual-caption{font-weight:700;max-width:220px}.matter-flow{display:flex;align-items:center;gap:14px;text-align:center}.matter-flow>div{display:flex;flex-direction:column;gap:5px;min-width:100px}.matter-flow b{font-size:16px}.matter-flow small{font-size:11px;color:#667085}.force-diagram{display:flex;align-items:center;gap:14px;font-size:20px}.force-arrow{font-size:14px;font-weight:800}.force-arrow.left{margin-left:-4px}.practice-review{margin-top:14px;padding:16px;border-radius:14px;background:#fff8e8;border:1px solid #f3dfaa}.practice-review h3{margin-top:0}.study-clock{font-variant-numeric:tabular-nums}.lessonpage{max-width:850px}.lesson-section{margin-bottom:16px}.example{background:#f7f7ff;border-left:4px solid var(--primary);padding:15px;border-radius:10px}.question{font-size:20px;font-weight:800;margin:12px 0}.options{display:grid;gap:9px}.option{text-align:left;background:#f8f9fc;border:1px solid var(--line);padding:13px;border-radius:12px}.answer-input{width:100%;box-sizing:border-box;padding:14px 15px;border:2px solid #dfe2eb;border-radius:12px;outline:none;margin-top:8px}.answer-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,232,.10)}.option:hover{border-color:var(--primary)}.option.correct{border-color:var(--good);background:#edfff7}.option.wrong{border-color:var(--danger);background:#fff0f0}.result{padding:14px;border-radius:12px;background:#f4f5fb}.shopitem{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}

.avatar-button{background:transparent;padding:0;border:0;display:grid;place-items:center}.avatar-wrap{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:18px;position:relative;display:grid;place-items:center;background:var(--avatar-bg,#dfe4ff);border:1px solid #d8dcef;box-shadow:0 5px 15px rgba(30,35,70,.08);overflow:hidden;user-select:none}.avatar .hair{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:25px;z-index:3}.avatar .face{font-size:34px;line-height:1;transform:translateY(5px)}.avatar .shirt{position:absolute;bottom:-3px;font-size:28px;z-index:2}.avatar.small{width:40px;height:40px;border-radius:13px}.avatar.small .face{font-size:24px}.avatar.small .hair{font-size:18px;top:2px}.avatar.small .shirt{font-size:19px}.avatar-card{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center}.avatar-preview{display:grid;place-items:center;min-height:170px;border:1px solid var(--line);border-radius:18px;background:#fafaff}.avatar.big{width:125px;height:125px;border-radius:34px}.avatar.big .face{font-size:68px}.avatar.big .hair{font-size:48px;top:8px}.avatar.big .shirt{font-size:54px}.avatar-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.avatar-option{padding:10px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:center;font-weight:800}.avatar-option.active{border-color:var(--primary);background:#f0f1ff;color:var(--primary)}.avatar-label{font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px}@media(max-width:700px){.avatar-card{grid-template-columns:1fr}.avatar-preview{min-height:150px}}
.toast{position:fixed;right:20px;bottom:20px;background:#1d2233;color:#fff;padding:13px 16px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px #0002;z-index:20}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{min-height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:10px}.nav{white-space:nowrap;width:auto}.grid,.grid3{grid-template-columns:1fr}.topbar{padding:0 14px}.topstats .pill:nth-child(3){display:none}main{padding:18px}.hero{padding:22px}}
.accordion-list{display:flex;flex-direction:column;gap:14px}.accordion{padding:0;overflow:hidden}.accordion-head{width:100%;background:transparent;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;text-align:left;color:inherit}.accordion-head:hover{background:#fafaff}.chevron{font-size:24px;color:var(--muted);transition:transform .25s ease}.accordion.open .chevron{transform:rotate(180deg)}.accordion-body{display:none;padding:0 22px 18px}.accordion.open .accordion-body{display:block;animation:accordionIn .22s ease both}@keyframes accordionIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}.accordion-body .lesson{margin-top:8px}.accordion-body .lesson:first-child{margin-top:0}</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY="learnahead_demo_v1";
const subjects={
 math:{name:"Mathematics",icon:"📐",lessons:[
  {id:"m1",title:"Adding and subtracting integers",concept:"Integers are whole numbers. They can be positive, negative, or zero. On a number line, positive numbers are to the right of zero and negative numbers are to the left.",example:"Example: −3 + 7 = 4. Start at −3, then move 7 steps to the right. You land on 4.",visual:`<div class="number-line"><div class="nl-arrow">←</div><div class="nl-track"><span>−4</span><span>−3</span><span>−2</span><span>−1</span><span class="zero">0</span><span>1</span><span>2</span><span>3</span><span>4</span></div><div class="nl-arrow">→</div></div>`,vocab:[["integer","a whole number, such as −3, 0, or 8"],["subtract","take one number away from another"]]},
  {id:"m2",title:"Multiplying and dividing integers",concept:"When you multiply or divide integers, first look at their signs. Same signs give a positive answer. Different signs give a negative answer.",example:"Example: (−6) × 4 = −24. The signs are different, so the answer is negative. 6 × 4 = 24, so the answer is −24.",vocab:[["multiply","find the total in equal groups"],["divide","split a number into equal groups"]]},
  {id:"m3",title:"Fractions and decimals",concept:"Fractions and decimals can show the same amount. For example, three quarters is the same as 0.75.",example:"Example: 0.75 = 75/100 = 3/4. We can use either form to describe the same amount.",visual:`<div class="fraction-visual"><div class="fraction-grid"><i></i><i></i><i></i><i class="empty"></i></div><strong>3/4 = 0.75</strong></div>`,vocab:[["numerator","the top number of a fraction"],["denominator","the bottom number of a fraction"]]},
  {id:"m4",title:"Ratios and proportions",concept:"A ratio compares two amounts. We can simplify ratios by dividing both parts by the same number.",example:"Example: 6 red counters and 3 blue counters gives a ratio of 6:3, which simplifies to 2:1.",vocab:[["ratio","a comparison between amounts"],["simplify","make a ratio or fraction easier to read"]]},
  {id:"m5",title:"Algebraic expressions",concept:"An algebraic expression uses numbers, letters, and operations. A letter can stand for an unknown number.",example:"Example: If x = 4, then 3x + 2 = 3 × 4 + 2 = 14.",vocab:[["variable","a letter that represents a value"],["expression","numbers, letters, and operations written together"]]}
 ]},
 science:{name:"Science",icon:"🔬",lessons:[
  {id:"s1",title:"Plant and animal cells",concept:"Cells are the tiny building blocks of living things. Plant and animal cells have a cell membrane, cytoplasm, and nucleus. Plant cells also have a cell wall and chloroplasts.",example:"A chloroplast helps a plant make food using light. This process is called photosynthesis.",visual:`<div class="cell-diagram"><div class="cell-circle"><span class="cell-nucleus">Nucleus</span><span class="cell-chloro">Chloroplast</span><span class="cell-label">Cell</span></div><div class="visual-caption">Plant cells have chloroplasts and a cell wall.</div></div>`,vocab:[["cell","the basic building block of a living thing"],["nucleus","a part of a cell that contains genetic material"]]},
  {id:"s2",title:"States of matter",concept:"Matter can be a solid, liquid, or gas. The particles are packed and move differently in each state.",example:"When ice is heated, it melts and becomes liquid water. With more heating, the water can become a gas.",visual:`<div class="matter-flow"><div>🧊<b>Solid</b><small>particles stay close</small></div><span>→</span><div>💧<b>Liquid</b><small>particles can move around</small></div><span>→</span><div>💨<b>Gas</b><small>particles spread out</small></div></div>`,vocab:[["particle","a very small piece of matter"],["melting","changing from a solid into a liquid"]]},
  {id:"s3",title:"Forces",concept:"A force is a push or a pull. Forces can make an object speed up, slow down, change direction, or change shape.",example:"Friction is a force that can slow an object down when two surfaces rub together.",visual:`<div class="force-diagram"><span>🧍</span><div class="force-arrow">→ Push</div><span>📦</span><div class="force-arrow left">← Friction</div></div>`,vocab:[["force","a push or pull"],["friction","a force that acts when surfaces rub together"]]},
  {id:"s4",title:"Ecosystems",concept:"An ecosystem includes living things and the environment around them. Organisms depend on each other for food and resources.",example:"Example: In a pond, algae, insects, fish, water, and sunlight are parts of the ecosystem.",vocab:[["ecosystem","living things and their environment"],["organism","a living thing"]]},
  {id:"s5",title:"Energy",concept:"Energy can be transferred from one place or object to another. It can also change from one form to another.",example:"Example: A battery transfers chemical energy into electrical energy in a circuit.",vocab:[["energy","the ability to cause change"],["transfer","move from one place or form to another"]]}
 ]},
 english:{name:"English",icon:"📖",lessons:[
  {id:"e1",title:"Paragraph structure",concept:"A good paragraph usually has one main idea. It starts with a topic sentence, adds supporting details, and may finish with a linking or concluding sentence.",example:"Example: Start with your main point. Then add a fact, example, or explanation that supports it.",vocab:[["topic sentence","a sentence that introduces the main idea"],["evidence","information that supports an idea"]]},
  {id:"e2",title:"Comparing texts",concept:"When you compare two texts, look for what is similar and what is different. You can compare their ideas, language, structure, or purpose.",example:"Example: Text A is funny, whereas Text B is serious. The word 'whereas' helps show a difference.",vocab:[["compare","find similarities and differences"],["contrast","show how things are different"]]},
  {id:"e3",title:"Sentence structure",concept:"A clear sentence usually has a subject and a verb. Different sentence types can make writing more interesting.",example:"Example: 'The dog ran home.' has a subject, the dog, and a verb, ran.",vocab:[["subject","who or what the sentence is about"],["verb","a word that shows an action or state"]]},
  {id:"e4",title:"Persuasive writing",concept:"Persuasive writing tries to convince the reader. Strong arguments use clear claims, reasons, and evidence.",example:"Example: 'School gardens are useful because they give students a chance to learn about plants.'",vocab:[["claim","the main point you want the reader to accept"],["evidence","information that supports a claim"]]}
 ]},
 eal:{name:"EAL",icon:"🌍",lessons:[
  {id:"a1",title:"Academic command words",concept:"Questions use command words to tell you what to do. Words such as describe, explain, compare, identify, and evaluate each ask for a different kind of answer.",example:"Example: 'Explain why plants need light' means you should give a reason. Just writing 'light' is not enough.",vocab:[["describe","give details about something"],["explain","give reasons or show how or why"]]},
  {id:"a2",title:"Science classroom English",concept:"Science lessons use useful words and sentence starters. Knowing them makes it easier to follow instructions and talk about results.",example:"Example: 'The results show that...' is a useful way to start a sentence when you are talking about evidence.",vocab:[["evidence","information that supports an idea"],["result","what an investigation produces"]]},
  {id:"a3",title:"Math classroom English",concept:"Math questions use words such as calculate, estimate, simplify, and compare. Learning these words helps you know exactly what to do.",example:"Example: 'Calculate 25% of 80' means find the answer, while 'estimate' means give a sensible approximate answer.",vocab:[["calculate","work out an exact answer"],["estimate","find an answer that is close to the exact value"]]},
  {id:"a4",title:"Academic vocabulary",concept:"Academic words appear across many subjects. Learning them helps you understand textbooks, questions, and instructions.",example:"Example: 'Identify the main idea' means find and name the main idea.",vocab:[["identify","find and name something"],["justify","give reasons or evidence for an answer"]]}
 ]}
};

function seed(){return {users:{},session:null}}
let db=JSON.parse(localStorage.getItem(KEY)||"null")||seed();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function user(){return db.session?db.users[db.session]:null}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
function today(){return new Date().toISOString().slice(0,10)}
function calcStreak(u){if(!u.activity.length)return 0;let dates=[...new Set(u.activity)].sort().reverse(), cur=new Date(today());let streak=0;for(let d of dates){let ds=new Date(d);let diff=Math.round((cur-ds)/86400000);if(diff===0){streak++;cur=new Date(cur-86400000)}else if(diff===1){streak++;cur=ds}else break}return streak}
function minutesToday(u){return Math.floor((u.studySecondsByDay?.[today()]||0)/60)}
function addStudySeconds(sec){let u=user();if(!u)return;u.studySecondsByDay??={};u.studySecondsByDay[today()]=(u.studySecondsByDay[today()]||0)+Math.max(0,Math.floor(sec));if(minutesToday(u)>=u.goal&&!u.activity.includes(today())){u.activity.push(today());u.streak=calcStreak(u)}}
function stopQuizTimer(){if(window.quizTimer){clearInterval(window.quizTimer);window.quizTimer=null}if(window.currentQuiz?.startedAt){let now=Date.now();window.currentQuiz.elapsedSeconds=Math.max(0,Math.floor((now-window.currentQuiz.startedAt)/1000));}}
function startQuizTimer(){if(window.quizTimer)clearInterval(window.quizTimer);if(!window.currentQuiz)return;window.currentQuiz.startedAt=Date.now();window.currentQuiz.elapsedSeconds=0;window.quizTimer=setInterval(()=>{if(document.visibilityState==='visible'&&window.currentQuiz){window.currentQuiz.elapsedSeconds=Math.floor((Date.now()-window.currentQuiz.startedAt)/1000);let el=document.getElementById('quizTimer');if(el)el.textContent=formatTime(window.currentQuiz.elapsedSeconds)}},1000)}
function formatTime(sec){let m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function progress(u){let total=0,done=0;Object.keys(subjects).forEach(k=>{total+=subjects[k].lessons.length;done+=subjects[k].lessons.filter(l=>u.completed.includes(l.id)).length});return total?Math.round(done/total*100):0}
function ensureUserFields(u){u.completed??=[];u.scores??={};u.coins??=0;u.xp??=0;u.activity??=[];u.minutesByDay??={};u.studySecondsByDay??={};u.streak??=0;u.goal??=20;u.achievements??=[];u.freeze??=0;u.lastLesson??=null;u.avatar??=defaultAvatar()}
function defaultAvatar(){return {face:"🙂",hair:"🧢",shirt:"👕",bg:"#dfe4ff"}}
function avatarMarkup(a,big=false){a=a||defaultAvatar();return `<span class="avatar ${big?"big":""}" style="--avatar-bg:${esc(a.bg||"#dfe4ff")}"><span class="hair">${a.hair||"🧢"}</span><span class="face">${a.face||"🙂"}</span><span class="shirt">${a.shirt||"👕"}</span></span>`}
function setAvatarPart(part,value){let u=user();u.avatar??=defaultAvatar();u.avatar[part]=value;save();renderProfile()}
function shell(page,content){
 return `<div class="app"><header class="topbar"><div class="logo">StrikeLearn</div><div class="topstats"><button class="avatar-button" title="Customize avatar" onclick="renderProfile()">${avatarMarkup(user().avatar||defaultAvatar(),false)}</button><span class="pill streak">🔥 ${user().streak} day streak</span><span class="pill coin">🪙 ${user().coins}</span><span class="pill">⭐ ${user().xp} XP</span></div></header><div class="layout"><aside class="sidebar">
 <button class="nav ${page==='home'?'active':''}" onclick="renderHome()">🏠 Dashboard</button>
 <button class="nav ${page==='learn'?'active':''}" onclick="renderLearn()">📚 Learn</button><button class="nav ${page==='practice'?'active':''}" onclick="renderPractice()">✏️ Practice</button><button class="nav ${page==='games'?'active':''}" onclick="renderMiniGames()">🎮 Mini Games</button>
 <button class="nav ${page==='shop'?'active':''}" onclick="renderShop()">🛍️ Shop</button>
 <button class="nav ${page==='profile'?'active':''}" onclick="renderProfile()">👤 Profile</button>
 <button class="nav" onclick="logout()">↪ Log out</button>
 </aside><main>${content}</main></div></div>`;
}
function render(){if(!user())return renderAuth();ensureUserFields(user());renderHome()}
let captchaAnswer=null;

function openLesson(sk,lid){return openLearn(sk,lid)}

function toggleSection(id){const el=document.getElementById(id);if(!el)return;const card=el.closest('.accordion');if(card)card.classList.toggle('open');}
function renderLearn(){
 stopStudyTimer(); let u=user();
 document.getElementById("root").innerHTML=shell("learn",`<div class="row"><div><h1>Choose your subject!</h1><p class="muted">Pick a subject to start learning.</p></div></div><div class="accordion-list">${Object.entries(subjects).map(([k,s],idx)=>`<div class="card accordion ${idx===0?'open':''}"><button class="accordion-head" onclick="toggleSection('learn-${k}')"><div class="subject"><div class="icon">${s.icon}</div><div><h3 style="margin-bottom:3px">${s.name}</h3><span class="tag">${s.lessons.length} topics</span></div></div><span class="chevron">⌄</span></button><div id="learn-${k}" class="accordion-body">${s.lessons.map((l,i)=>`<div class="lesson"><div><b>${i+1}. ${l.title}</b><div class="muted" style="font-size:13px">${ucompleted(l.id)?"Completed":"Ready to learn"}</div></div><button class="btn ${ucompleted(l.id)?"secondary":""}" onclick="openLearn('${k}','${l.id}')">${ucompleted(l.id)?"Review":"Start"}</button></div>`).join('')}</div></div>`).join('')}</div>`);

function lessonConcepts(l){
 if(l.concepts) return l.concepts;
 let arr=[{title:"Core idea",text:l.concept,visual:l.visual||null},{title:"Worked example",text:l.example,visual:l.exampleVisual||null}];
 if(l.vocab?.length) arr.push({title:"Key words",text:l.vocab.map(v=>`<b>${v[0]}</b> — ${v[1]}`).join("<br>"),visual:null});
 return arr;
}

function openLearn(sk,lid){
 stopStudyTimer();
 let s=subjects[sk],l=s.lessons.find(x=>x.id===lid),cs=lessonConcepts(l);
 user().lastLesson=`${sk}:${lid}`;save();
 window.learnState={sk,lid,concepts:cs,index:0,checkQs:makeQuiz(sk,lid).slice(0,3),score:0,answered:false,startedAt:Date.now(),elapsedSeconds:0};
 document.getElementById("root").innerHTML=shell("learn",`<div class="lessonpage"><button class="btn secondary" onclick="leaveStudy()">← Back to lessons</button><div class="card lesson-section" style="margin-top:14px"><div class="row"><span class="tag">${s.name}</span><span class="tag">⏱ <span id="studyClock">00:00</span></span></div><div id="learnStage"></div><div id="conceptDots" class="concept-dots"></div></div></div>`);
 renderLearnConcept(); startStudyTimer();
}
function renderLearnConcept(){
 let st=window.learnState,c=st.concepts[st.index],dots=document.getElementById('conceptDots');
 dots.innerHTML=st.concepts.map((_,i)=>`<span class="concept-dot ${i===st.index?'active':i<st.index?'done':''}"></span>`).join('');
 let last=st.index===st.concepts.length-1;
 document.getElementById('learnStage').innerHTML=`<div class="card" style="box-shadow:none;padding:6px 0 0;border:0"><h1>${c.title}</h1><div class="muted" style="margin-bottom:12px">Concept ${st.index+1} of ${st.concepts.length}</div><p style="font-size:17px;line-height:1.7">${c.text}</p>${c.visual?`<div class="concept-visual">${c.visual}</div>`:''}<div class="row" style="margin-top:22px"><span class="muted">${last?'Ready for a quick check?':"You are doing great!"}</span><button class="btn" onclick="${last?'startLearnCheck()':'nextConcept()'}">${last?'Check what you learned →':'Next concept →'}</button></div></div>`;
}
function nextConcept(){window.learnState.index++;renderLearnConcept()}
function startLearnCheck(){
 let st=window.learnState;st.mode='check';st.index=0;st.answered=false;document.getElementById('learnStage').innerHTML=`<div class="row"><h1>Quick Check</h1><span class="tag">3 questions</span></div><p class="muted">These 3 questions check the concepts you just learned.</p><div id="learnQuiz"></div>`;showLearnCheck();
}
function showLearnCheck(){let st=window.learnState,q=st.checkQs[st.index],box=document.getElementById('learnQuiz');let body=q.type==='input'?`<input id="learnAnswer" class="answer-input" autocomplete="off" placeholder="Type your answer here"><button class="btn" style="margin-top:10px" onclick="answerLearnCheck()">Check answer →</button>`:`<div class="options">${q.opts.map((o,i)=>`<button class="option" onclick="answerLearnCheck(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;box.innerHTML=`<div class="row"><span class="tag">Question ${st.index+1} of 3</span><span class="tag">Score ${st.score}</span></div><div class="question">${q.q}</div>${body}`;if(q.type==='input')setTimeout(()=>document.getElementById('learnAnswer')?.focus(),0)}
function normalizeAnswer(v){return String(v??'').trim().toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,' ')}
function answerLearnCheck(i){let st=window.learnState;if(st.answered)return;st.answered=true;let q=st.checkQs[st.index],response=q.type==='input'?document.getElementById('learnAnswer')?.value:q.opts[i],ok=normalizeAnswer(response)===normalizeAnswer(q.ans),buttons=[...document.querySelectorAll('#learnQuiz .option')];buttons.forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.ans)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});if(q.type==='input'){let inp=document.getElementById('learnAnswer');if(inp){inp.disabled=true;inp.classList.add(ok?'correct':'wrong')}}if(ok)st.score++;document.getElementById('learnQuiz').insertAdjacentHTML('beforeend',`<div class="result" style="margin-top:12px">${ok?'Nice! 🎉':`Not quite. The answer is <b>${q.ans}</b>.` }<br><button class="btn" style="margin-top:10px" onclick="nextLearnCheck()">${st.index===2?'Finish lesson':'Next question →'}</button></div>`)}
function nextLearnCheck(){let st=window.learnState;st.index++;st.answered=false;if(st.index>=3)return finishLearn();showLearnCheck()}
function finishLearn(){let st=window.learnState,u=user(),lid=st.lid,first=!u.completed.includes(lid);if(first)u.completed.push(lid);let earned=5+(st.score===3?3:0)+(first?5:0);u.coins+=earned;u.xp+=5+st.score;addStudySeconds(st.elapsedSeconds||0);if(u.completed.length>=3&&!u.achievements.includes('starter'))u.achievements.push('starter');save();stopStudyTimer();document.getElementById('root').innerHTML=shell('learn',`<div class="card" style="text-align:center;padding:35px"><div style="font-size:48px">${st.score===3?'🎉':'💪'}</div><h1>Lesson Complete!</h1><div class="big">${st.score}/3</div><p class="muted">You studied for <b>${formatTime(st.elapsedSeconds||0)}</b>.</p><p>+${earned} 🪙 &nbsp; +${5+st.score} XP</p><button class="btn" style="margin-top:15px" onclick="renderHome()">Back to Dashboard</button></div>`)}

function renderPractice(){
 stopStudyTimer(); let u=user();
 document.getElementById('root').innerHTML=shell('practice',`<div class="row"><div><h1>Choose your subject!</h1><p class="muted">Pick a subject to start practicing.</p></div></div><div class="accordion-list">${Object.entries(subjects).map(([k,s],idx)=>`<div class="card accordion ${idx===0?'open':''}"><button class="accordion-head" onclick="toggleSection('practice-${k}')"><div class="subject"><div class="icon">${s.icon}</div><div><h3 style="margin-bottom:3px">${s.name}</h3><span class="tag">${s.lessons.length} topics</span></div></div><span class="chevron">⌄</span></button><div id="practice-${k}" class="accordion-body">${s.lessons.map((l,i)=>`<div class="lesson"><div><b>${i+1}. ${l.title}</b><div class="muted" style="font-size:13px">${u.scores[l.id]!==undefined?'Best score: '+u.scores[l.id]+'/10':'Not practiced yet'}</div></div><button class="btn" onclick="openPractice('${k}','${l.id}')">Practice</button></div>`).join('')}</div></div>`).join('')}</div>`);
}
function openPractice(sk,lid){
 stopStudyTimer();let s=subjects[sk],l=s.lessons.find(x=>x.id===lid);window.practiceState={sk,lid,qs:makeQuiz(sk,lid),index:0,score:0,answered:false,startedAt:Date.now(),elapsedSeconds:0};
 document.getElementById('root').innerHTML=shell('practice',`<div class="lessonpage"><button class="btn secondary" onclick="renderPractice()">← Back to practice</button><div class="card" style="margin-top:14px"><div class="row"><div><span class="tag">${s.name}</span><h1 style="margin:8px 0 0">${l.title}</h1></div><span class="tag">⏱ <span id="studyClock">00:00</span></span></div><p class="muted">Solve the problem. If you miss it, we'll review the related concept.</p><div id="practiceBox"></div></div></div>`);showPracticeQuestion();startStudyTimer();
}
function showPracticeQuestion(){let st=window.practiceState,q=st.qs[st.index],box=document.getElementById('practiceBox');let body=q.type==='input'?`<input id="practiceAnswer" class="answer-input" autocomplete="off" placeholder="Type your answer here"><button class="btn" style="margin-top:10px" onclick="answerPractice()">Check answer →</button>`:`<div class="options">${q.opts.map((o,i)=>`<button class="option" onclick="answerPractice(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>`;box.innerHTML=`<div class="row"><span class="tag">Question ${st.index+1} of ${st.qs.length}</span><span class="tag">Score ${st.score}</span></div><div class="question">${q.q}</div>${body}`;if(q.type==='input')setTimeout(()=>document.getElementById('practiceAnswer')?.focus(),0)}
function answerPractice(i){let st=window.practiceState;if(st.answered)return;st.answered=true;let q=st.qs[st.index],response=q.type==='input'?document.getElementById('practiceAnswer')?.value:q.opts[i],ok=normalizeAnswer(response)===normalizeAnswer(q.ans),buttons=[...document.querySelectorAll('#practiceBox .option')];buttons.forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.ans)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});if(q.type==='input'){let inp=document.getElementById('practiceAnswer');if(inp){inp.disabled=true;inp.classList.add(ok?'correct':'wrong')}}if(ok)st.score++;let lesson=subjects[st.sk].lessons.find(x=>x.id===st.lid);let review=!ok?`<div class="practice-review"><h3>📚 Let us review the concept</h3><p>${lesson.concept}</p>${lesson.visual?`<div class="concept-visual">${lesson.visual}</div>`:''}<p><b>Correct answer:</b> ${q.ans}</p><button class="btn secondary" onclick="retryPracticeQuestion()">Try again →</button></div>`:'';document.getElementById('practiceBox').insertAdjacentHTML('beforeend',`<div class="result" style="margin-top:12px">${ok?'Correct! 🎉':'Not quite.'}${review}<br><button class="btn" style="margin-top:10px" onclick="nextPracticeQuestion()">${st.index===st.qs.length-1?'Finish practice':'Next question →'}</button></div>`)}
function retryPracticeQuestion(){let st=window.practiceState;st.answered=false;showPracticeQuestion()}
function nextPracticeQuestion(){let st=window.practiceState;st.index++;st.answered=false;if(st.index>=st.qs.length)return finishPractice();showPracticeQuestion()}
function finishPractice(){let st=window.practiceState,u=user();u.scores[st.lid]=Math.max(u.scores[st.lid]||0,st.score);u.xp+=st.score;u.coins+=Math.floor(st.score/2);addStudySeconds(st.elapsedSeconds||0);save();stopStudyTimer();document.getElementById('root').innerHTML=shell('practice',`<div class="card" style="text-align:center;padding:35px"><div style="font-size:48px">${st.score>=8?'🎉':'💪'}</div><h1>Practice Complete!</h1><div class="big">${st.score}/${st.qs.length}</div><p class="muted">You practiced for <b>${formatTime(st.elapsedSeconds||0)}</b>.</p><button class="btn" style="margin-top:15px" onclick="renderPractice()">Back to Practice</button></div>`)}
function startStudyTimer(){stopStudyTimer();let st=window.learnState||window.practiceState;if(!st)return;st.lastTick=Date.now();window.studyTimer=setInterval(()=>{if(document.visibilityState!=='visible'){st.lastTick=Date.now();return}let now=Date.now();st.elapsedSeconds+=(now-st.lastTick)/1000;st.lastTick=now;let el=document.getElementById('studyClock');if(el)el.textContent=formatTime(Math.floor(st.elapsedSeconds))},250)}
function stopStudyTimer(){if(window.studyTimer){clearInterval(window.studyTimer);window.studyTimer=null}let st=window.learnState||window.practiceState;if(st&&st.lastTick&&document.visibilityState==='visible'){st.elapsedSeconds+=(Date.now()-st.lastTick)/1000;st.lastTick=Date.now()}}
function leaveStudy(){stopStudyTimer();window.learnState=null;window.practiceState=null;renderLearn()}

function renderMiniGames(){
 stopStudyTimer();
 document.getElementById('root').innerHTML=shell('games',`<div class="row"><div><h1>🎮 Mini Games</h1><p class="muted">Take a quick break and keep your brain active.</p></div></div><div class="grid"><div class="card"><div class="icon" style="font-size:34px">⚡</div><h2>Quick Math</h2><p class="muted">Solve as many easy math questions as you can in 30 seconds.</p><p><span class="tag">Earn up to 30 🪙</span></p><button class="btn" onclick="startQuickMath()">Play →</button></div><div class="card"><div class="icon" style="font-size:34px">🧠</div><h2>Memory Match</h2><p class="muted">Remember the cards and match the pairs.</p><p><span class="tag">Coming soon</span></p><button class="btn secondary" disabled>Coming soon</button></div></div>`);
}
function startQuickMath(){
 window.miniGame={score:0,total:0,time:30,started:false,answer:null,a:null,b:null,op:null,timer:null};
 document.getElementById('root').innerHTML=shell('games',`<div class="lessonpage"><div class="card" style="text-align:center"><div class="row"><button class="btn secondary" onclick="endQuickMath()">← Exit</button><span class="tag">⏱ <span id="gameClock">30</span>s</span><span class="tag">Score <span id="gameScore">0</span></span></div><h1 style="margin-top:24px">⚡ Quick Math</h1><p class="muted">Solve it before the timer runs out!</p><div id="gameQuestion" class="question" style="font-size:42px;margin:28px 0"></div><div id="gameOptions" class="options"></div></div></div>`);
 nextQuickMath();
 window.miniGame.timer=setInterval(()=>{let g=window.miniGame;if(!g)return;g.time--;let el=document.getElementById('gameClock');if(el)el.textContent=g.time;if(g.time<=0)finishQuickMath()},1000);
}
function nextQuickMath(){let g=window.miniGame;if(!g)return;g.total++;g.a=Math.floor(Math.random()*12)+1;g.b=Math.floor(Math.random()*12)+1;g.op=Math.random()<.5?'+':'−';g.answer=g.op==='+'?g.a+g.b:g.a-g.b;let vals=new Set([g.answer]);while(vals.size<4){vals.add(g.answer+(Math.floor(Math.random()*7)-3));}let opts=[...vals].sort(()=>Math.random()-.5);document.getElementById('gameQuestion').textContent=`${g.a} ${g.op} ${g.b} = ?`;document.getElementById('gameOptions').innerHTML=opts.map(v=>`<button class="option" onclick="answerQuickMath(${v})">${v}</button>`).join('')}
function answerQuickMath(v){let g=window.miniGame;if(!g||g.time<=0)return;if(v===g.answer){g.score++;let sc=document.getElementById('gameScore');if(sc)sc.textContent=g.score;nextQuickMath()}else{toast('Not quite — try the next one!');nextQuickMath()}}
function finishQuickMath(){let g=window.miniGame;if(!g)return;clearInterval(g.timer);window.miniGame=null;let u=user();let coins=Math.min(30,g.score*2);u.coins+=coins;u.xp+=g.score;save();document.getElementById('root').innerHTML=shell('games',`<div class="card" style="text-align:center;padding:40px"><div style="font-size:52px">🎉</div><h1>Time's up!</h1><div class="big">${g.score}</div><p class="muted">Correct answers in 30 seconds</p><p>+${coins} 🪙 &nbsp; +${g.score} XP</p><button class="btn" onclick="startQuickMath()">Play again</button> <button class="btn secondary" onclick="renderMiniGames()">Back to games</button></div>`)}
function endQuickMath(){let g=window.miniGame;if(g){clearInterval(g.timer);window.miniGame=null}renderMiniGames()}

function renderShop(){let u=user();let items=[["🧊","Streak Freeze","Protect one missed day.",100,"freeze"],["💡","Hint Pack","A future hint for a quiz.",60,"hint"],["✨","Profile Sparkle","A cosmetic profile item.",150,"sparkle"]];document.getElementById("root").innerHTML=shell("shop",`<div class="card"><h1>🛍️ Coin Shop</h1><p class="muted">Spend coins earned from learning. No real-money purchases in this prototype.</p><div>${items.map(it=>`<div class="shopitem"><div><div style="font-size:24px">${it[0]}</div><b>${it[1]}</b><div class="muted">${it[2]}</div></div><button class="btn" ${u.coins<it[3]?"disabled":""} onclick="buy('${it[4]}',${it[3]})">🪙 ${it[3]}</button></div>`).join("")}</div></div>`)}
function buy(type,cost){let u=user();if(u.coins<cost)return toast("Not enough coins.");u.coins-=cost;if(type==="freeze")u.freeze++;save();toast("Item purchased!");renderShop()}
function renderProfile(){let u=user();u.avatar??=defaultAvatar();let a=u.avatar;document.getElementById("root").innerHTML=shell("profile",`<div class="grid"><div class="card"><h2>👤 Profile</h2><div class="avatar-card"><div class="avatar-preview">${avatarMarkup(a,true)}</div><div><h3 style="margin-bottom:4px">Customize your avatar</h3><p class="muted">Make your StrikeLearn profile feel like yours.</p><div class="avatar-label">Face</div><div class="avatar-controls">${["🙂","😎","🤓","😄","😮","😴"].map(x=>`<button class="avatar-option ${a.face===x?'active':''}" onclick="setAvatarPart('face','${x}')">${x}</button>`).join('')}</div><div class="avatar-label">Hair / Hat</div><div class="avatar-controls">${["🧢","🎩","🧑‍🎓","🪖","👒","🧑‍🚀"].map(x=>`<button class="avatar-option ${a.hair===x?'active':''}" onclick="setAvatarPart('hair','${x}')">${x}</button>`).join('')}</div><div class="avatar-label">Shirt</div><div class="avatar-controls">${["👕","🥋","🧥","🎽","👔","🦺"].map(x=>`<button class="avatar-option ${a.shirt===x?'active':''}" onclick="setAvatarPart('shirt','${x}')">${x}</button>`).join('')}</div><div class="avatar-label">Background</div><div class="avatar-controls">${[["#dfe4ff","Lavender"],["#dff7ea","Mint"],["#fff0d9","Peach"],["#e8e8e8","Cloud"],["#e2f2ff","Sky"],["#f7e5ff","Pink"]].map(([c,n])=>`<button class="avatar-option ${a.bg===c?'active':''}" style="background:${c}" onclick="setAvatarPart('bg','${c}')">${n}</button>`).join('')}</div></div></div></div></div><div class="card"><h2>📊 Profile Stats</h2><p><b>${esc(u.nickname)}</b></p><p class="muted">@${esc(u.username)}</p><p><span class="tag">${esc(u.curriculum)}</span> <span class="tag">${esc(u.year)}</span></p><hr style="border:0;border-top:1px solid var(--line)"><p>🎯 Daily goal: <b>${u.goal} min</b></p><p>🔥 Streak: <b>${u.streak} days</b></p><p>🪙 Coins: <b>${u.coins}</b></p><p>⭐ XP: <b>${u.xp}</b></p><p>🏆 Achievements: <b>${u.achievements.length}</b></p></div><div class="card"><h2>🏆 Achievements</h2>${u.achievements.includes("perfect")?"<p>💯 Perfect Score — scored 10/10</p>":""}${u.achievements.includes("starter")?"<p>📚 Getting Started — completed 3 lessons</p>":""}${!u.achievements.length?'<p class="muted">Complete lessons and quizzes to unlock achievements.</p>':""}</div></div>`)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
render();
</script>
</body>
</html>
